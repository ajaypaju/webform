# Reviewer path: `make up`. Code is baked into the image; no bind mounts (see compose.dev.yaml for the dev loop).

x-app: &app
  build: .
  image: webform-app
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    redpanda:
      condition: service_healthy
    redpanda-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

services:
  postgres:
    image: postgres:16
    # WHY: the superuser only bootstraps; init.sh creates the four least-privilege roles the app connects as (I11).
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webform
      WEBFORM_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      WEBFORM_API_PASSWORD: ${DB_API_PASSWORD}
      WEBFORM_INGEST_PASSWORD: ${DB_INGEST_PASSWORD}
      WEBFORM_WRITER_PASSWORD: ${DB_WRITER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    # WHY: pinned to the last patch of the previous minor line (17 patch releases in) rather than the
    # newest line, so the reviewer path is reproducible and not on a fresh release train.
    image: redpandadata/redpanda:v25.3.17
    # WHY: no `--mode dev-container`, and redpanda-init forces write_caching_default=false: the image ships
    # developer_mode=true, which defaults write caching ON (ack before fsync) and would silently void I1.
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: verifies the durability settings, creates the topics, exits. api/ingest wait for it.
  redpanda-init:
    image: redpandadata/redpanda:v25.3.17
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      RPK_BROKERS: redpanda:9092
      RPK_ADMIN_HOSTS: redpanda:9644
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # I1: the broker must fsync before acking. Set it, then refuse to start the stack unless it took.
        rpk cluster config set write_caching_default false
        val=$$(rpk cluster config get write_caching_default | tr -d '"')
        echo "write_caching_default=$$val"
        [ "$$val" = "false" ] || { echo "ERROR: write_caching_default must be false"; exit 1; }
        rpk topic describe submissions >/dev/null 2>&1 || rpk topic create submissions -p 12 -r 1
        rpk topic describe submissions.dlq >/dev/null 2>&1 || rpk topic create submissions.dlq -p 1 -r 1
        rpk topic list

  # One-shot: schema as the owning role, then the upcoming monthly partitions. api/ingest wait for it.
  migrate:
    image: webform-app
    build: .
    env_file: .env
    environment:
      DB_USERNAME: webform_owner
      DB_PASSWORD: ${DB_OWNER_PASSWORD}
    command: sh -c "php artisan migrate --force && php artisan submissions:ensure-partitions"
    depends_on:
      postgres:
        condition: service_healthy

  # I2: the only writer of submissions. Restarts on crash; a stop waits for the batch in flight.
  consumer:
    image: webform-app
    build: .
    env_file: .env
    environment:
      APP_ROLE: consumer
      DB_USERNAME: webform_writer
      DB_PASSWORD: ${DB_WRITER_PASSWORD}
      LOG_CHANNEL: stderr
    command: php artisan submissions:consume
    # WHY: tini as PID 1 so the PHP process is a child: signals forward, and a crash of the process (not a
    # `docker stop`) exits the container and triggers the restart policy. PID 1 itself cannot be SIGKILLed.
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    # The loop touches a heartbeat file every iteration (idle polls included); stale for a minute means stuck.
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y storage/framework/consumer.heartbeat 2>/dev/null || echo 0) )) -lt 60"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    environment:
      APP_ROLE: api
      DB_USERNAME: webform_api
      DB_PASSWORD: ${DB_API_PASSWORD}
    ports:
      - "8000:8000"

  ingest:
    <<: *app
    environment:
      APP_ROLE: ingest
      DB_USERNAME: webform_ingest
      DB_PASSWORD: ${DB_INGEST_PASSWORD}
    ports:
      - "8080:8000"

volumes:
  pgdata:
  redpanda:

# WHY: a fixed subnet so compose.load.yaml can name it as the trusted-proxy range without recreating the network.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
